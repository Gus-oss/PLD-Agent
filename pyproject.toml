[project]
name = "pld-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pld-agent"]
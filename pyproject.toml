# Se declara el proyecto Python con su nombre, las versionesde pyyhon y las dependencias. 
# Remplaza el requirments.txt  y guarda la configuracion de herramientas como ruff  y pytest

[project]
name = "pld-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.2,<3",
    "scikit-learn",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
ppackages = ["src/pld_agent"]